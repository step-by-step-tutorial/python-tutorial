[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodata_platform"
version = "1.0.0"
description = "Build city address CSV files from Overture Maps addresses enriched with GeoNames data."
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14",
    "shapely>=2.0",
]

[project.optional-dependencies]
download = [
    "overturemaps",
]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["geodata_platform*"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
