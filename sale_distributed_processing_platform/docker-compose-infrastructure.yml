name: test
services:
  database:
    image: postgres:16
    hostname: database
    container_name: database
    environment:
      POSTGRES_DB: sale_database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./scripts/create_postgres_tables.sql:/docker-entrypoint-initdb.d/create_postgres_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username admin --dbname sale_database"]
      interval: 5s
      timeout: 5s
      retries: 20
  databaseui:
    image: adminer
    container_name: databaseui
    hostname: databaseui
    restart: always
    ports:
      - "8083:8080" # UI
  datalake:
    image: minio/minio:latest
    hostname: datalake
    container_name: datalake
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: administrator
    ports:
      - "9000:9000" #
      - "9001:9001" # UI
    volumes:
      - datalake_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  datalake-init:
    image: minio/mc:latest
    hostname: datalake-init
    container_name: datalake-init
    depends_on:
      datalake:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://datalake:9000 admin administrator
        mc mb --ignore-existing local/sale-datalake

  datawarehouse:
    image: clickhouse/clickhouse-server:latest
    hostname: datawarehouse
    container_name: datawarehouse
    environment:
      CLICKHOUSE_DB: sale_datawarehouse
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # UI
    volumes:
      - datawarehouse_data:/var/lib/clickhouse
      - ./scripts/create_clickhouse_tables.sql:/docker-entrypoint-initdb.d/create_clickhouse_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password admin --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
  datalake_data:
  datawarehouse_data:
