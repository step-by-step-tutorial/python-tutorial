name: ${COMPOSE_PROJECT_NAME}

services:
  database:
    image: ${POSTGRES_IMAGE}
    hostname: ${POSTGRES_HOST}
    container_name: ${POSTGRES_CONTAINER_NAME}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${POSTGRES_VOLUME}:/var/lib/postgresql/data
      - ./scripts/create_postgres_tables.sql:/docker-entrypoint-initdb.d/create_postgres_tables.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username ${POSTGRES_USER} --dbname ${POSTGRES_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  database-ui:
    image: ${ADMINER_IMAGE}
    hostname: ${ADMINER_HOST}
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
  datalake:
    image: ${MINIO_IMAGE}
    hostname: ${MINIO_HOST}
    container_name: ${MINIO_CONTAINER_NAME}
    command: >
      server /data
      --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ${MINIO_VOLUME}:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  datalake-init:
    image: ${MINIO_CLIENT_IMAGE}
    hostname: ${MINIO_CLIENT_HOST}
    container_name: ${MINIO_CLIENT_CONTAINER_NAME}
    depends_on:
      datalake:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://${MINIO_HOST}:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"

        mc mb --ignore-existing \
          "local/$${MINIO_BUCKET_NAME}"

  datawarehouse:
    image: ${CLICKHOUSE_IMAGE}
    hostname: ${CLICKHOUSE_HOST}
    container_name: ${CLICKHOUSE_CONTAINER_NAME}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
    volumes:
      - ${CLICKHOUSE_VOLUME}:/var/lib/clickhouse
      - ./scripts/create_clickhouse_tables.sql:/docker-entrypoint-initdb.d/create_clickhouse_tables.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  master:
    image: ${SPARK_IMAGE}
    build:
      context: .
      dockerfile: ${SPARK_DOCKERFILE}
    hostname: ${SPARK_MASTER_HOST}
    container_name: ${SPARK_MASTER_CONTAINER_NAME}
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host ${SPARK_MASTER_HOST}
      --port ${SPARK_MASTER_RPC_PORT}
      --webui-port ${SPARK_MASTER_UI_PORT}
    ports:
      - "${SPARK_MASTER_RPC_PORT}:${SPARK_MASTER_RPC_PORT}"
      - "${SPARK_MASTER_UI_PORT}:${SPARK_MASTER_UI_PORT}"
    volumes:
      - ./resources:/app/resources
  worker:
    image: ${SPARK_IMAGE}
    build:
      context: .
      dockerfile: ${SPARK_DOCKERFILE}
    hostname: ${SPARK_WORKER_HOST}
    container_name: ${SPARK_WORKER_CONTAINER_NAME}
    depends_on:
      master:
        condition: service_started
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      ${SPARK_MASTER_URL}
      --webui-port ${SPARK_WORKER_UI_PORT}
    ports:
      - "${SPARK_WORKER_UI_PORT}:${SPARK_WORKER_UI_PORT}"
    volumes:
      - ./resources:/app/resources
  application:
    image: ${APPLICATION_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    hostname: ${APPLICATION_HOST}
    container_name: ${APPLICATION_CONTAINER_NAME}
    environment:
      RESOURCES_DIR: ${APPLICATION_RESOURCES_DIR}
      OUTPUT_DIR: ${APPLICATION_OUTPUT_DIR}
      DATA_FILE: ${APPLICATION_DATA_FILE}

      SPARK_APPLICATION_NAME: ${SPARK_APPLICATION_NAME}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST}
      SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS}

      DATABASE_JDBC_URL: ${DATABASE_JDBC_URL}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      DATALAKE_ENDPOINT: ${DATALAKE_ENDPOINT}
      DATALAKE_ACCESS_KEY: ${DATALAKE_ACCESS_KEY}
      DATALAKE_SECRET_KEY: ${DATALAKE_SECRET_KEY}
      DATALAKE_BUCKET_NAME: ${DATALAKE_BUCKET_NAME}

      DATAWAREHOUSE_HOST: ${DATAWAREHOUSE_HOST}
      DATAWAREHOUSE_PORT: ${DATAWAREHOUSE_PORT}
      DATAWAREHOUSE_NAME: ${DATAWAREHOUSE_NAME}
      DATAWAREHOUSE_USER: ${DATAWAREHOUSE_USER}
      DATAWAREHOUSE_PASSWORD: ${DATAWAREHOUSE_PASSWORD}
    volumes:
      - ./resources:/app/resources
      - ./output:/app/output
    depends_on:
      database:
        condition: service_healthy
      datalake:
        condition: service_healthy
      datalake-init:
        condition: service_completed_successfully
      datawarehouse:
        condition: service_healthy
      master:
        condition: service_started
    command: >
      sh -c "python -m src.main && tail -f /dev/null"

volumes:
  database_data:
    name: ${POSTGRES_VOLUME}

  datalake_data:
    name: ${MINIO_VOLUME}

  datawarehouse_data:
    name: ${CLICKHOUSE_VOLUME}