name: dev
services:
  database:
    image: postgres:16
    hostname: database
    container_name: database
    environment:
      POSTGRES_DB: sale_database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./scripts/create_postgres_tables.sql:/docker-entrypoint-initdb.d/create_postgres_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username admin --dbname sale_database"]
      interval: 5s
      timeout: 5s
      retries: 20
  databaseui:
    image: adminer
    container_name: databaseui
    hostname: databaseui
    restart: always
    ports:
      - "8083:8080" # UI
  datalake:
    image: minio/minio:latest
    hostname: datalake
    container_name: datalake
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: administrator
    ports:
      - "9000:9000" #
      - "9001:9001" # UI
    volumes:
      - datalake_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  datalake-init:
    image: minio/mc:latest
    hostname: datalake-init
    container_name: datalake-init
    depends_on:
      datalake:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://datalake:9000 admin administrator
        mc mb --ignore-existing local/sale-datalake
  datawarehouse:
    image: clickhouse/clickhouse-server:latest
    hostname: datawarehouse
    container_name: datawarehouse
    environment:
      CLICKHOUSE_DB: sale_datawarehouse
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # UI
    volumes:
      - datawarehouse_data:/var/lib/clickhouse
      - ./scripts/create_clickhouse_tables.sql:/docker-entrypoint-initdb.d/create_clickhouse_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password admin --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
  master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: samanalishiri/spark-4-java21-python3:latest
    container_name: master
    hostname: master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host master --port 7077 --webui-port 8080
    ports:
      - "7077:7077"   # master RPC
      - "8080:8080"   # master UI
    volumes:
      - "./resources:/app/resources"
  worker:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: samanalishiri/spark-4-java21-python3:latest
    container_name: worker
    hostname: worker
    depends_on:
      - master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://master:7077 --webui-port 8081
    ports:
      - "8081:8081"   # worker UI
    volumes:
      - "./resources:/app/resources"
  application:
    image: samanalishiri/application:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application
    hostname: application
    environment:
      RESOURCES_DIR: /app/resources
      OUTPUT_DIR: /app/output
      DATA_FILE: data.csv
      SPARK_APPLICATION_NAME: SALE_DISTRIBUTED_PROCESSING_PLATFORM
      SPARK_MASTER_URL: spark://master:7077
      SPARK_DRIVER_HOST: application
      SPARK_DRIVER_BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://database:5432/sale_database
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: sale_database
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATALAKE_ENDPOINT: http://datalake:9000
      DATALAKE_ACCESS_KEY: admin
      DATALAKE_SECRET_KEY: administrator
      DATALAKE_BUCKET_NAME: sale-datalake
      DATAWAREHOUSE_HOST: datawarehouse
      DATAWAREHOUSE_PORT: 8123
      DATAWAREHOUSE_NAME: sale_datawarehouse
      DATAWAREHOUSE_USER: admin
      DATAWAREHOUSE_PASSWORD: admin
    volumes:
      - ./resources:/app/resources
    depends_on:
      database:
        condition: service_healthy
      datalake:
        condition: service_healthy
      datalake-init:
        condition: service_completed_successfully
      datawarehouse:
        condition: service_healthy
      master:
        condition: service_started
    command: sh -c "python -m src.main && tail -f /dev/null"

volumes:
  database_data:
  datalake_data:
  datawarehouse_data:
