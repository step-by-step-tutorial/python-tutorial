  APP_HOUSE_DATALAKE_ACCESS_KEY: ${APP_HOUSE_DATALAKE_ACCESS_KEY}
  APP_HOUSE_DATALAKE_SECRET_KEY: ${APP_HOUSE_DATALAKE_SECRET_KEY}
  APP_HOUSE_DATALAKE_BUCKET_NAME: ${APP_HOUSE_DATALAKE_BUCKET_NAME}
  APP_HOUSE_DATALAKE_AUDIT_BUCKET_NAME: ${APP_HOUSE_DATALAKE_AUDIT_BUCKET_NAME}
  APP_HOUSE_DATALAKE_SCHEME: ${APP_HOUSE_DATALAKE_SCHEME}
  APP_HOUSE_DATALAKE_ENVIRONMENT: ${APP_HOUSE_DATALAKE_ENVIRONMENT}
