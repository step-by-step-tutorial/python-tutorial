  APP_AUDIT_DATALAKE_ACCESS_KEY: ${APP_AUDIT_DATALAKE_ACCESS_KEY}
  APP_AUDIT_DATALAKE_SECRET_KEY: ${APP_AUDIT_DATALAKE_SECRET_KEY}
  APP_AUDIT_DATALAKE_BUCKET_NAME: ${APP_AUDIT_DATALAKE_BUCKET_NAME}
  APP_AUDIT_DATALAKE_SCHEME: ${APP_AUDIT_DATALAKE_SCHEME}
  APP_AUDIT_DATALAKE_ENVIRONMENT: ${APP_AUDIT_DATALAKE_ENVIRONMENT}
