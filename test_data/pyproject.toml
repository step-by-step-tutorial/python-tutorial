[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test_data"
version = "1.1.0"
description = "Generate CSV, JSON, database, or Kafka test data from plain text sources and JSON configs."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "confluent-kafka>=2.5",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
csv-data-generator = "test_data.cli:main"
csv-data-generator-api = "test_data.api.dataset_api:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["test_data*"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
