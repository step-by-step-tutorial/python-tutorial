[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test_data"
version = "1.1.0"
description = "Generate CSV test data from plain text sources and JSON configs."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
csv-data-generator = "cli:main"
csv-data-generator-api = "api:run"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["api", "cli", "columns", "config", "datasets", "exceptions", "generator", "schemas", "sources", "writer"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
