name: ${COMPOSE_PROJECT_NAME}
services:
  database:
    image: ${DATABASE_IMAGE}
    hostname: ${TEST_DATA_DATABASE_HOST}
    container_name: ${DATABASE_CONTAINER_NAME}
    environment:
      POSTGRES_DB: ${TEST_DATA_DATABASE_NAME}
      POSTGRES_USER: ${TEST_DATA_DATABASE_USER}
      POSTGRES_PASSWORD: ${TEST_DATA_DATABASE_PASSWORD}
    ports:
      - "${TEST_DATA_DATABASE_PORT}:5432"
    volumes:
      - ${DATABASE_VOLUME}:/var/lib/postgresql/data
      - ./scripts/database/create_schema.sql:/docker-entrypoint-initdb.d/10_create_test_data_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username ${TEST_DATA_DATABASE_USER} --dbname ${TEST_DATA_DATABASE_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  database-ui:
    image: ${ADMINER_IMAGE}
    hostname: ${ADMINER_HOST}
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: LOCALHOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,CONTAINER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: LOCALHOST://localhost:9092,CONTAINER://kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: LOCALHOST
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,LOCALHOST:PLAINTEXT,CONTAINER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    hostname: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9094 \
          --create \
          --if-not-exists \
          --topic sale-events \
          --partitions 3 \
          --replication-factor 1
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    hostname: kafdrop
    restart: always
    ports:
      - "9002:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9094
      JVM_OPTS: "-Xms32M -Xmx64M"
  test-data:
    image: ${TEST_DATA_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-data
    hostname: test-data
    environment:
      PROJECT_ROOT: /app
      CONFIG_DIR: /app/config
      OUTPUT_DIR: /app/output
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql+psycopg2://${TEST_DATA_DATABASE_USER}:${TEST_DATA_DATABASE_PASSWORD}@${TEST_DATA_DATABASE_HOST}:${TEST_DATA_DATABASE_PORT}/${TEST_DATA_DATABASE_NAME}
      DATABASE_SCHEMA: test_data
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "${TEST_DATA_API_PORT}:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      database:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
volumes:
  database_data:
    name: ${DATABASE_VOLUME}

