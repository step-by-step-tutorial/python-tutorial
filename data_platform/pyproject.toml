[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "data_platform"
version = "1.0.0"
description = "Data engineering and distributed processing platform"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "pyspark",
    "itables",
    "sqlalchemy",
    "psycopg2-binary",
    "boto3",
    "clickhouse-connect",
    "asyncpg",
    "apache-airflow",
    "confluent-kafka",
    "pydantic",
    #    "scikit-learn",
    #    "joblib",
    #    "torch",
    #    "mlflow",
    #    "fastapi",
    #    "uvicorn",
    #    "pydantic",
    #    "prometheus-client"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-mock"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data_platform*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Airflow currently can be run on POSIX-compliant Operating Systems:RuntimeWarning:airflow",
]
