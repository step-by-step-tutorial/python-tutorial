  DATA_PLATFORM_AUDIT_DATABASE_JDBC_URL: ${DATA_PLATFORM_AUDIT_DATABASE_JDBC_URL}
  DATA_PLATFORM_AUDIT_DATABASE_SQLALCHEMY_URL: ${DATA_PLATFORM_AUDIT_DATABASE_SQLALCHEMY_URL}
