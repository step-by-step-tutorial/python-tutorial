[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_prediction"
version = "0.1.0"
description = "Trains and runs machine learning models on the data platform datasets."
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pandas",
    "scikit-learn",
    "joblib",
    "pyarrow",
    "matplotlib",
    "mlflow",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml_prediction*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
