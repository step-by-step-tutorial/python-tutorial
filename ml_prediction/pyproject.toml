[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_prediction"
version = "0.1.0"
description = "Machine learning workflow for house price prediction."
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pandas",
    "scikit-learn",
    "joblib",
]

[project.scripts]
ml-prediction = "ml_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml_prediction*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
